basePath: /
definitions:
  auth.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  game.Game:
    properties:
      board:
        items:
          items:
            type: integer
          type: array
        type: array
      currentPlayerID:
        description: user ID of the player whose turn it is
        type: string
      id:
        type: string
      private:
        description: optional field to indicate if the game is private or public
        type: boolean
      result:
        $ref: '#/definitions/game.GameResult'
      status:
        $ref: '#/definitions/game.GameStatus'
      userID1:
        type: string
      userID2:
        type: string
      winnerID:
        type: string
    type: object
  game.GameResult:
    enum:
    - win
    - draw
    type: string
    x-enum-varnames:
    - ResultWin
    - ResultDraw
  game.GameStatus:
    enum:
    - waiting
    - in_progress
    - finished
    type: string
    x-enum-varnames:
    - StatusWaiting
    - StatusInProgress
    - StatusFinished
  server.CreateGameRequest:
    properties:
      gameID:
        type: string
      private:
        type: boolean
      userID:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  server.GiveUpRequest:
    properties:
      gameID:
        type: string
      userID:
        type: string
    type: object
  server.JoinAnyGameRequest:
    properties:
      userID:
        type: string
    type: object
  server.JoinGameRequest:
    properties:
      gameID:
        type: string
      userID:
        type: string
    type: object
  server.MoveRequest:
    properties:
      gameID:
        type: string
      userID:
        type: string
      x:
        type: integer
      "y":
        type: integer
    type: object
  server.UserLoginRequest:
    properties:
      password:
        type: string
      userID:
        type: string
    type: object
  server.UserRefreshTokenRequest:
    properties:
      refreshToken:
        type: string
      userID:
        type: string
    type: object
  server.UserSignupRequest:
    properties:
      password:
        type: string
      userID:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Multiplayer Tic Tac Toe game server
  title: Tic Tac Toe API
  version: "1.0"
paths:
  /api/games:
    post:
      consumes:
      - application/json
      operationId: createGame
      parameters:
      - description: Create game request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateGameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a new game
      tags:
      - games
  /api/games/{gameID}:
    get:
      operationId: getGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get game state
      tags:
      - games
  /api/games/{gameID}/giveup:
    post:
      consumes:
      - application/json
      operationId: giveUpGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      - description: Give up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.GiveUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Give up the game
      tags:
      - games
  /api/games/{gameID}/join:
    post:
      consumes:
      - application/json
      operationId: joinGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      - description: Join game request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.JoinGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Join a waiting game
      tags:
      - games
  /api/games/{gameID}/move:
    post:
      consumes:
      - application/json
      operationId: makeMove
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      - description: Move request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.MoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Make a move
      tags:
      - games
  /api/games/join:
    post:
      consumes:
      - application/json
      operationId: joinAnyGame
      parameters:
      - description: Join any game request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.JoinAnyGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Join any available game
      tags:
      - games
  /api/users/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: User login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Log in an existing user
      tags:
      - users
  /api/users/refresh-token:
    post:
      consumes:
      - application/json
      operationId: refresh-token
      parameters:
      - description: User refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UserRefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Refresh access token using refresh token
      tags:
      - users
  /api/users/signup:
    post:
      consumes:
      - application/json
      operationId: signup
      parameters:
      - description: User signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UserSignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Sign up a new user
      tags:
      - users
swagger: "2.0"
