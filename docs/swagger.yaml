basePath: /
definitions:
  game.CreateGameCommand:
    properties:
      private:
        type: boolean
    type: object
  game.Game:
    properties:
      board:
        items:
          items:
            type: integer
          type: array
        type: array
      current_player_id:
        description: user ID of the player whose turn it is
        type: string
      id:
        type: string
      private:
        description: optional field to indicate if the game is private or public
        type: boolean
      result:
        $ref: '#/definitions/game.GameResult'
      status:
        $ref: '#/definitions/game.GameStatus'
      user_id1:
        type: string
      user_id1_last_seen:
        description: |-
          Presence timestamps, updated on every action and read by each player.
          Pointers so they stay omitted until the corresponding player is seen.
        type: string
      user_id2:
        type: string
      user_id2_last_seen:
        type: string
      winner_id:
        type: string
    type: object
  game.GameResult:
    enum:
    - win
    - draw
    type: string
    x-enum-varnames:
    - ResultWin
    - ResultDraw
  game.GameStatus:
    enum:
    - waiting
    - in_progress
    - finished
    - cancelled
    type: string
    x-enum-varnames:
    - StatusWaiting
    - StatusInProgress
    - StatusFinished
    - StatusCancelled
  game.MakeMoveCommand:
    properties:
      gameID:
        type: string
      x:
        type: integer
      "y":
        type: integer
    type: object
  server.AccessTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  server.ErrorCode:
    enum:
    - ERR_GAME_NOT_FOUND
    - ERR_GAME_NOT_WAITING
    - ERR_GAME_NOT_ACTIVE
    - ERR_NOT_YOUR_TURN
    - ERR_NOT_IN_GAME
    - ERR_CELL_OCCUPIED
    - ERR_OUT_OF_BOUNDS
    - ERR_PASSWORD_TOO_SHORT
    - ERR_USER_ALREADY_EXISTS
    - ERR_USER_NOT_FOUND
    - ERR_INVALID_CREDENTIALS
    - ERR_REFRESH_TOKEN_DELETED
    - ERR_TOKEN_INVALID
    - ERR_TOKEN_EXPIRED
    - ERR_TOKEN_SIGNATURE_INVALID
    type: string
    x-enum-varnames:
    - CodeGameNotFound
    - CodeGameNotWaiting
    - CodeGameNotActive
    - CodeNotYourTurn
    - CodeNotInGame
    - CodeCellOccupied
    - CodeOutOfBounds
    - CodePasswordTooShort
    - CodeUserAlreadyExists
    - CodeUserNotFound
    - CodeInvalidCredentials
    - CodeRefreshTokenDeleted
    - CodeTokenInvalid
    - CodeTokenExpired
    - CodeTokenSignatureInvalid
  server.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/server.ErrorCode'
      error:
        type: string
    type: object
  server.UserLoginRequest:
    properties:
      password:
        type: string
      user_id:
        type: string
    type: object
  server.UserSignupRequest:
    properties:
      password:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Multiplayer Tic Tac Toe game server
  title: Tic Tac Toe API
  version: "1.0"
paths:
  /api/games:
    get:
      operationId: getLatestGame
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get the authenticated user's most recent game
      tags:
      - games
    post:
      consumes:
      - application/json
      operationId: createGame
      parameters:
      - description: Create game request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameCommand'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Create a new game
      tags:
      - games
  /api/games/{gameID}:
    get:
      operationId: getGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get game state
      tags:
      - games
  /api/games/{gameID}/giveup:
    post:
      operationId: giveUpGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Give up the game
      tags:
      - games
  /api/games/{gameID}/join:
    post:
      operationId: joinGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Join a waiting game
      tags:
      - games
  /api/games/{gameID}/move:
    post:
      consumes:
      - application/json
      operationId: makeMove
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      - description: Move request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.MakeMoveCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Make a move
      tags:
      - games
  /api/games/{gameID}/quit:
    post:
      operationId: quitGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Quit a game that is still waiting for an opponent
      tags:
      - games
  /api/games/join:
    post:
      operationId: joinAnyGame
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Join any available game
      tags:
      - games
  /api/users/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: User login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AccessTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Log in an existing user
      tags:
      - users
  /api/users/refresh-token:
    post:
      consumes:
      - application/json
      operationId: refresh-token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AccessTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Refresh access token using refresh token
      tags:
      - users
  /api/users/signup:
    post:
      consumes:
      - application/json
      operationId: signup
      parameters:
      - description: User signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UserSignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.AccessTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Sign up a new user
      tags:
      - users
swagger: "2.0"
