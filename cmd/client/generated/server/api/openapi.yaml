openapi: 3.0.1
info:
  contact: {}
  description: Multiplayer Tic Tac Toe game server
  title: Tic Tac Toe API
  version: "1.0"
servers:
- url: //localhost:8080/
paths:
  /api/games:
    post:
      operationId: createGame
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.CreateGameRequest"
        description: Create game request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Internal Server Error
      summary: Create a new game
      tags:
      - games
      x-codegen-request-body-name: request
  /api/games/join:
    post:
      operationId: joinAnyGame
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
      summary: Join any available game
      tags:
      - games
  /api/games/{gameID}:
    get:
      operationId: getGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Not Found
      summary: Get game state
      tags:
      - games
  /api/games/{gameID}/giveup:
    post:
      operationId: giveUpGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.GiveUpRequest"
        description: Give up request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
      summary: Give up the game
      tags:
      - games
      x-codegen-request-body-name: request
  /api/games/{gameID}/join:
    post:
      operationId: joinGame
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.JoinGameRequest"
        description: Join game request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
      summary: Join a waiting game
      tags:
      - games
      x-codegen-request-body-name: request
  /api/games/{gameID}/move:
    post:
      operationId: makeMove
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.MoveRequest"
        description: Move request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/game.Game"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
      summary: Make a move
      tags:
      - games
      x-codegen-request-body-name: request
  /api/users/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.UserLoginRequest"
        description: User login request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.TokenPair"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Internal Server Error
      summary: Log in an existing user
      tags:
      - users
      x-codegen-request-body-name: request
  /api/users/refresh-token:
    post:
      operationId: refresh-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.UserRefreshTokenRequest"
        description: User refresh token request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.TokenPair"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Internal Server Error
      summary: Refresh access token using refresh token
      tags:
      - users
      x-codegen-request-body-name: request
  /api/users/signup:
    post:
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/server.UserSignupRequest"
        description: User signup request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.TokenPair"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/server.ErrorResponse"
          description: Internal Server Error
      summary: Sign up a new user
      tags:
      - users
      x-codegen-request-body-name: request
components:
  schemas:
    auth.TokenPair:
      example:
        access_token: access_token
        refresh_token: refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      type: object
    game.Game:
      example:
        board:
        - - 0
          - 0
        - - 0
          - 0
        currentPlayerID: currentPlayerID
        id: id
        private: true
        result: win
        status: waiting
        userID1: userID1
        userID2: userID2
        winnerID: winnerID
      properties:
        board:
          items:
            items:
              type: integer
            type: array
          type: array
        currentPlayerID:
          description: user ID of the player whose turn it is
          type: string
        id:
          type: string
        private:
          description: optional field to indicate if the game is private or public
          type: boolean
        result:
          $ref: "#/components/schemas/game.GameResult"
        status:
          $ref: "#/components/schemas/game.GameStatus"
        userID1:
          type: string
        userID2:
          type: string
        winnerID:
          type: string
      type: object
    game.GameResult:
      enum:
      - win
      - draw
      type: string
      x-enum-varnames:
      - ResultWin
      - ResultDraw
    game.GameStatus:
      enum:
      - waiting
      - in_progress
      - finished
      type: string
      x-enum-varnames:
      - StatusWaiting
      - StatusInProgress
      - StatusFinished
    server.CreateGameRequest:
      properties:
        private:
          type: boolean
      type: object
    server.ErrorCode:
      enum:
      - ERR_GAME_NOT_FOUND
      - ERR_GAME_NOT_WAITING
      - ERR_GAME_NOT_ACTIVE
      - ERR_NOT_YOUR_TURN
      - ERR_NOT_IN_GAME
      - ERR_CELL_OCCUPIED
      - ERR_OUT_OF_BOUNDS
      - ERR_PASSWORD_TOO_SHORT
      - ERR_USER_ALREADY_EXISTS
      - ERR_USER_NOT_FOUND
      - ERR_INVALID_CREDENTIALS
      - ERR_REFRESH_TOKEN_DELETED
      - ERR_TOKEN_INVALID
      - ERR_TOKEN_EXPIRED
      - ERR_TOKEN_SIGNATURE_INVALID
      type: string
      x-enum-varnames:
      - CodeGameNotFound
      - CodeGameNotWaiting
      - CodeGameNotActive
      - CodeNotYourTurn
      - CodeNotInGame
      - CodeCellOccupied
      - CodeOutOfBounds
      - CodePasswordTooShort
      - CodeUserAlreadyExists
      - CodeUserNotFound
      - CodeInvalidCredentials
      - CodeRefreshTokenDeleted
      - CodeTokenInvalid
      - CodeTokenExpired
      - CodeTokenSignatureInvalid
    server.ErrorResponse:
      example:
        code: ERR_GAME_NOT_FOUND
        error: error
      properties:
        code:
          $ref: "#/components/schemas/server.ErrorCode"
        error:
          type: string
      type: object
    server.GiveUpRequest:
      properties:
        gameID:
          type: string
      type: object
    server.JoinGameRequest:
      properties:
        gameID:
          type: string
      type: object
    server.MoveRequest:
      properties:
        gameID:
          type: string
        x:
          type: integer
        "y":
          type: integer
      type: object
    server.UserLoginRequest:
      properties:
        password:
          type: string
        userID:
          type: string
      type: object
    server.UserRefreshTokenRequest:
      properties:
        refreshToken:
          type: string
        userID:
          type: string
      type: object
    server.UserSignupRequest:
      properties:
        password:
          type: string
        userID:
          type: string
      type: object
x-original-swagger-version: "2.0"
